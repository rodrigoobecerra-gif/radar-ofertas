name: Radar semanal Meta Ads Library
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node weekly.mjs
        env:
          RADAR_SEARCH_LIMIT: ${{ github.event_name == 'pull_request' && '2' || '8' }}
      - name: Guardar informe privado
        if: github.event_name == 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/latest.md
          git diff --cached --quiet || git commit -m 'Actualizar radar semanal verificado'
          git push
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: radar-semanal
          path: |
            out/*.json
            reports/latest.json
            reports/latest.md
          retention-days: 7
